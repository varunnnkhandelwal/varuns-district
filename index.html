<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Varun's District — a playable portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<body>
<canvas id="view"></canvas>
<div id="fade"></div>
<div id="prompt"></div>
<div id="grade"></div><div id="vignette"></div>
<div id="hud">
  <div id="name"><small>Varun Khandelwal</small><b id="place">Varun’s District</b></div>
  <div id="skills"></div>
  <div id="np"></div>
  <div id="help"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span><span><kbd>E</kbd> Talk</span><span><kbd>↑</kbd> Into a door to enter</span><span><kbd>J</kbd> Journal</span></div>
</div>
<div id="area"></div>
<div id="toast"></div>
<div id="talk"></div>
<aside id="journal"></aside>
<aside id="card"></aside>
<div id="arcade"><div class="win"><header class="t-play"><span>Star Sweep</span></header><canvas id="inv" width="160" height="144"></canvas><footer><kbd>A</kbd><kbd>D</kbd> Move &nbsp; <kbd>Space</kbd> Fire &nbsp; <kbd>Esc</kbd> Quit</footer></div></div>
<div id="title">
  <div>
    <h1>Hello, I’m Varun.</h1>
    <div class="rule">◆</div>
    <small>A Product Designer</small>
    <small class="press">Press any key</small>
  </div>
</div>
<script src="src/sprites.js"></script>
<script src="src/world.js"></script>
<script src="src/interiors.js"></script>
<script src="music/playlist.js"></script>
<script src="src/invaders.js"></script>
<script src="src/main.js"></script>
<script src="src/touch.js"></script>
